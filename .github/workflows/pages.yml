name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        working-directory: frontend
        env:
          # Set repo variable VITE_API_BASE_URL to the Render URL + /api
          # (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://oracle-api.onrender.com/api' }}
          VITE_BASE_PATH: /oracle/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
